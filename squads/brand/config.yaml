# ============================================================
# BRAND SQUAD — config.yaml (Cerebro de Roteamento)
# ============================================================
# Para cada TASK, define quais AGENTS, FRAMEWORKS,
# CHECKLISTS, TEMPLATES e REGISTRIES sao obrigatorios.
# ============================================================

squad:
  name: brand
  version: "1.0.0"
  description: "Brand Strategy + Identity Squad do MMOS"
  chief_agent: brand-chief
  methodology: "HRM (Hierarchical Role Modeling)"
  total_agents: 15

# ============================================================
# AGENTS REGISTRY
# ============================================================
agents:
  # Strategy, Equity & Brand Building
  brand-chief:
    file: agents/brand-chief.md
    role: orchestrator
    layer: [research, strategy, identity, activation, governance, measurement]

  david-aaker:
    file: agents/david-aaker.md
    role: specialist
    layer: [strategy, governance]
    domain: "brand equity, identity system, architecture"

  kevin-keller:
    file: agents/kevin-keller.md
    role: specialist
    layer: [research, strategy, measurement]
    domain: "CBBE, brand resonance, brand mantra"

  jean-noel-kapferer:
    file: agents/jean-noel-kapferer.md
    role: specialist
    layer: [strategy]
    domain: "identity prism, luxury branding"

  byron-sharp:
    file: agents/byron-sharp.md
    role: specialist
    layer: [research, strategy, governance, measurement]
    domain: "mental/physical availability, distinctive assets, growth laws"

  denise-yohn:
    file: agents/denise-yohn.md
    role: specialist
    layer: [research, strategy, activation]
    domain: "brand as business, internal alignment, culture"

  # Positioning & Competitive Advantage
  al-ries:
    file: agents/al-ries.md
    role: specialist
    layer: [strategy]
    domain: "positioning, category creation, focus"

  marty-neumeier:
    file: agents/marty-neumeier.md
    role: specialist
    layer: [strategy]
    domain: "brand gap, simplicity, differentiation"

  # Identity & Visual Systems
  alina-wheeler:
    file: agents/alina-wheeler.md
    role: specialist
    layer: [identity, governance]
    domain: "brand identity process, brand book, visual systems"

  emily-heyward:
    file: agents/emily-heyward.md
    role: specialist
    layer: [identity, activation]
    domain: "obviousness, creative consistency, brand launch"

  # Messaging & Narrative
  donald-miller:
    file: agents/donald-miller.md
    role: specialist
    layer: [identity]
    domain: "StoryBrand SB7, messaging clarity"

  miller-sticky-brand:
    file: agents/miller-sticky-brand.md
    role: sub-specialist
    layer: [identity]
    domain: "sticky messages, stickiness system"

  # Special Operations
  naming-strategist:
    file: agents/naming-strategist.md
    role: specialist
    layer: [identity]
    domain: "naming systems, shortlists, testing"

  archetype-consultant:
    file: agents/archetype-consultant.md
    role: specialist
    layer: [identity]
    domain: "brand archetypes, personality, consistency"

  domain-scout:
    file: agents/domain-scout.md
    role: specialist
    layer: [identity]
    domain: "domains, handles, availability, heuristics"

# ============================================================
# ROUTING: TASK → AGENTS → FRAMEWORKS → CHECKLISTS → TEMPLATES
# ============================================================
