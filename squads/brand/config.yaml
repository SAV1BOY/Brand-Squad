# ============================================================
# BRAND SQUAD — config.yaml (Cerebro de Roteamento)
# ============================================================
# Para cada TASK, define quais AGENTS, FRAMEWORKS,
# CHECKLISTS, TEMPLATES e REGISTRIES sao obrigatorios.
# ============================================================

squad:
  name: brand
  version: "1.3.0"
  description: "Brand Strategy + Identity Squad do MMOS"
  chief_agent: brand-chief
  methodology: "HRM (Hierarchical Role Modeling)"
  total_agents: 15

# ============================================================
# PRINCIPLES
# ============================================================
principles:
  - "Marca e ativo estrategico — gerenciar com o mesmo rigor de qualquer ativo do balanco"
  - "Identidade precede imagem — definir quem a marca e antes de comunicar"
  - "Coerencia sistemica — cada decisao avaliada pelo impacto em todas as camadas"
  - "Evidencia sobre intuicao — decisoes baseadas em dados empiricos, nao achismo"
  - "Integracao sobre purismo — combinar frameworks complementares, nao aderir a escola unica"
  - "Sequenciamento obrigatorio — Research → Strategy → Identity → Activation → Governance → Measurement"
  - "Quality gates inegociaveis — nenhum output sai abaixo do padrao GREEN (80%)"
  - "Arbitragem explicita — conflitos entre agentes documentados com trade-offs e racional"
  - "Memoria operacional — toda decisao registrada para rastreabilidade e aprendizado"
  - "Governanca continua — marca e sistema vivo que exige monitoramento e evolucao constante"

# ============================================================
# AGENTS REGISTRY
# ============================================================
agents:
  # Strategy, Equity & Brand Building
  brand-chief:
    file: agents/brand-chief.md
    role: orchestrator
    layer: [research, strategy, identity, activation, governance, measurement]

  david-aaker:
    file: agents/david-aaker.md
    role: specialist
    layer: [strategy, governance]
    domain: "brand equity, identity system, architecture"

  kevin-keller:
    file: agents/kevin-keller.md
    role: specialist
    layer: [research, strategy, measurement]
    domain: "CBBE, brand resonance, brand mantra"

  jean-noel-kapferer:
    file: agents/jean-noel-kapferer.md
    role: specialist
    layer: [strategy]
    domain: "identity prism, luxury branding"

  byron-sharp:
    file: agents/byron-sharp.md
    role: specialist
    layer: [research, strategy, governance, measurement]
    domain: "mental/physical availability, distinctive assets, growth laws"

  denise-yohn:
    file: agents/denise-yohn.md
    role: specialist
    layer: [research, strategy, activation]
    domain: "brand as business, internal alignment, culture"

  # Positioning & Competitive Advantage
  al-ries:
    file: agents/al-ries.md
    role: specialist
    layer: [strategy]
    domain: "positioning, category creation, focus"

  marty-neumeier:
    file: agents/marty-neumeier.md
    role: specialist
    layer: [strategy]
    domain: "brand gap, simplicity, differentiation"

  # Identity & Visual Systems
  alina-wheeler:
    file: agents/alina-wheeler.md
    role: specialist
