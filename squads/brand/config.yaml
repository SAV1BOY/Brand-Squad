# ============================================================
# CROSS-SQUAD INTEGRATION
# ============================================================
cross_squad:
  copy:
    handoff_from_brand:
      - "brand-voice-guide → copy/voice/brand-voices/"
      - "positioning-statement → copy/reference/"
      - "messaging-house → copy/frameworks/"
      - "brand-archetypes → copy/voice/"
    shared_assets:
      - phrases/tone-words-allowed
      - phrases/tone-words-forbidden
      - phrases/brand-descriptors-library

# ============================================================
# DEFAULTS
# ============================================================
defaults:
  review_agent: brand-chief
  min_checklists: 1
  registry_on_completion: true
  output_format: markdown
  language: "pt-BR"
