# ============================================================
# KPIs
# ============================================================
kpis:
  awareness:
    - metric: "Brand Recall"
      definition: "% que lembram da marca espontaneamente"
      frequency: trimestral
    - metric: "Top of Mind"
      definition: "% que citam a marca primeiro na categoria"
      frequency: trimestral
    - metric: "Share of Voice"
      definition: "% de mencoes da marca vs. concorrentes"
      frequency: mensal
  perception:
    - metric: "Net Promoter Score"
      definition: "Likelihood de recomendacao (0-10)"
      frequency: mensal
    - metric: "Brand Sentiment"
      definition: "% positivo vs. negativo em mencoes"
      frequency: semanal
    - metric: "Perceived Quality"
      definition: "Qualidade percebida vs. concorrentes"
      frequency: trimestral
  equity:
    - metric: "Brand Equity Score"
      definition: "Score composto (Aaker 4 dimensoes)"
      frequency: trimestral
    - metric: "Price Premium"
      definition: "% acima do preco medio da categoria"
      frequency: trimestral
    - metric: "Customer Lifetime Value"
      definition: "Valor medio do ciclo de vida do cliente"
      frequency: trimestral
  operational:
    - metric: "First-Pass Rate"
      definition: "% de tasks que passam no quality gate na primeira tentativa"
      frequency: mensal
    - metric: "Rework Loop Rate"
      definition: "Media de rework loops por task"
      frequency: mensal
    - metric: "Handoff Acceptance Rate"
      definition: "% de handoffs aceitos sem rejeicao pelo squad receptor"
      frequency: mensal
    - metric: "Cross-Squad Sync Compliance"
      definition: "% de syncs mensais realizados conforme cadencia"
      frequency: mensal

# ============================================================
# DEFAULTS
# ============================================================
defaults:
  review_agent: brand-chief
  min_checklists: 1
  registry_on_completion: true
  output_format: markdown
  language: "pt-BR"

# ============================================================
# QUALITY GATES
# ============================================================
quality_gates:
  layer_transitions:
    research_to_strategy:
      checklist: checklists/layer-gate-research-to-strategy
      approvers: [brand-chief, byron-sharp, kevin-keller]
    strategy_to_identity:
      checklist: checklists/layer-gate-strategy-to-identity
      approvers: [brand-chief, al-ries, david-aaker]
    identity_to_activation:
      checklist: checklists/layer-gate-identity-to-activation
      approvers: [brand-chief, alina-wheeler, emily-heyward]
    activation_to_governance:
      checklist: checklists/layer-gate-activation-to-governance
      approvers: [brand-chief, denise-yohn]

  scoring:
    green: ">=80% dos criterios aprovados"
    yellow: "60-79% — requer override do brand-chief com justificativa"
    red: "<60% — BLOQUEADO, rework obrigatorio"

  enforcement:
    red_blocks_progression: true
    yellow_requires_chief_override: true
    all_scores_registered: true
    registry: data/registries/brand-decisions-log

  cascade:
    # Ordem de validacao em cascata
    1_agent_gate: "cada agente valida seu proprio output"
    2_task_gate: "checklists definidos no routing acima"
    3_layer_gate: "layer transition gates acima"
    4_chief_gate: "brand-chief revisa output consolidado"
    5_final_gate: "validacao antes de handoff cross-squad"

  guide: docs/quality-gates-guide

# ============================================================
# ESCALATION
# ============================================================
escalation:
  levels:
    1: "agente re-executa com rework brief"
    2: "brand-chief arbitra usando Protocolo de Arbitragem"
    3: "HRM Chief review — decisao final do sistema"

  triggers:
    - "quality gate RED apos 3 rework loops"
    - "conflito entre 2+ agentes sem resolucao"
    - "task fora do escopo do squad"
    - "stakeholder override request"
    - "deadline em risco"
    - "decisao com impacto cross-squad"

  evidence_required:
    level_1: "output original + gate score + gap analysis"
    level_2: "level_1 + posicoes conflitantes + trade-offs documentados"
    level_3: "level_2 + historico de tentativas + impacto estimado"

  registry: data/registries/brand-decisions-log
  guide: docs/escalation-protocol

# ============================================================
# REWORK LOOPS
# ============================================================
rework:
  trigger: "quality gate score < green threshold (80%)"
  process:
    1: "gate identifica falhas especificas (criterios nao atendidos)"
    2: "gera Rework Brief com falhas + sugestoes de melhoria"
    3: "re-atribui ao agente responsavel"
    4: "agente re-executa com foco nas falhas"
    5: "re-valida pelo mesmo quality gate"
  max_loops: 3
  on_max_loops: "escalation automatica para nivel 2"
  registry: data/registries/improvement-backlog
  guide: docs/rework-loops-guide

# ============================================================
# CADENCE
# ============================================================
cadence:
  post_task_review: "apos cada task concluida — registrar em learnings-log"
  quarterly_brand_review: "Q1/Q2/Q3/Q4 — task quarterly-brand-review no routing"
  cross_squad_sync: "mensal — task cross-squad-brand-sync no routing"
  learning_retrospective: "trimestral — consolidar improvement-backlog"
  registry_cleanup: "trimestral — arquivar registros antigos"

# ============================================================
# OPERATIONAL MEMORY
# ============================================================
memory:
  registries:
    decisions: data/registries/brand-decisions-log
    claims: data/registries/brand-claims-registry
    touchpoints: data/registries/brand-touchpoints-registry
    violations: data/registries/brand-violations-log
    distinctive_assets: data/registries/distinctive-assets-registry
    naming: data/registries/naming-registry
    assumptions: data/registries/assumptions-log
    risks: data/registries/risk-log
    improvements: data/registries/improvement-backlog
    learnings: data/registries/learnings-log
    handoffs: data/registries/handoff-log

  learning_loop: docs/learning-and-memory-guide
  kaizen_cycle: "Execute → Measure → Learn → Improve → Execute"

