    scope: "positioning, equity, architecture, differentiation"
  identity_team:
    members: [alina-wheeler, emily-heyward, donald-miller, miller-sticky-brand]
    coordinator: alina-wheeler
    scope: "visual identity, messaging, guidelines, launch"
  research_team:
    members: [byron-sharp, kevin-keller, denise-yohn]
    coordinator: byron-sharp
    scope: "market research, perception, availability, internal alignment"

