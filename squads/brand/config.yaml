    frameworks:
      - aaker-brand-equity-model
      - keller-cbbe-pyramid
      - distinctive-assets-system
    checklists:
      - aaker/aaker-equity-audit
      - sharp/distinctive-assets-audit
    templates:
      - analysis/brand-audit-report-template
    registry: data/registries/brand-decisions-log

  category-and-competitor-research:
    agents: [al-ries, byron-sharp, brand-chief]
    frameworks:
      - ries-positioning
      - category-entry-points
      - competitive-framing
    checklists:
